<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin — Ruta Naturals</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;1,9..144,300&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f4ede1; --cream-deep: #ebe1cf; --sand: #d8c8ad;
    --sage: #8a9a7b; --sage-deep: #5b6e52; --forest: #2d3a2a;
    --terracotta: #b8674a; --terracotta-soft: #d49278;
    --ink: #1f1d18; --ink-soft: #4a463d; --gold: #a88a4a; --pearl: #fbf7ee;
    --display: 'Fraunces', Georgia, serif; --serif: 'Cormorant Garamond', serif;
    --sans: 'Inter', -apple-system, sans-serif;
    --green: #4a7c5c; --red: #b84a4a; --amber: #c47e3a;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: var(--sans); background: var(--cream); color: var(--ink);
    line-height: 1.6; font-weight: 300; min-height: 100vh;
  }

  /* ── Login ── */
  #login-screen {
    position: fixed; inset: 0; z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    background: var(--cream); padding: 2rem;
  }
  #login-screen.hidden { display: none; }
  .login-card {
    background: var(--pearl); padding: 3rem 2.5rem; border-radius: 12px;
    box-shadow: 0 30px 80px rgba(45,58,42,0.1);
    border: 1px solid rgba(45,58,42,0.06);
    max-width: 380px; width: 100%; text-align: center;
  }
  .login-card img { height: 60px; width: auto; margin-bottom: 1.5rem; object-fit: contain; }
  .login-card h1 {
    font-family: var(--display); font-weight: 300; font-size: 1.6rem;
    color: var(--forest); margin-bottom: 0.3rem;
  }
  .login-card h1 em { color: var(--terracotta); font-style: italic; }
  .login-card p { color: var(--ink-soft); font-size: 0.85rem; margin-bottom: 1.8rem; }
  .login-card label {
    display: block; font-size: 0.66rem; text-transform: uppercase;
    letter-spacing: 0.2em; color: var(--sage-deep); font-weight: 500;
    text-align: left; margin-bottom: 0.5rem;
  }
  .login-card input {
    width: 100%; padding: 0.85rem 1rem; background: var(--cream);
    border: 1px solid rgba(45,58,42,0.15); border-radius: 6px;
    font-family: var(--sans); font-size: 0.95rem; color: var(--ink);
    margin-bottom: 1.2rem; transition: border-color 0.3s ease;
  }
  .login-card input:focus { outline: none; border-color: var(--forest); }
  .login-card .btn {
    width: 100%; padding: 0.95rem; background: var(--forest);
    color: var(--cream); border: none; border-radius: 999px;
    font-family: var(--sans); font-size: 0.78rem; font-weight: 500;
    text-transform: uppercase; letter-spacing: 0.2em; cursor: pointer;
    transition: all 0.3s ease;
  }
  .login-card .btn:hover { background: var(--terracotta); }
  .login-error {
    margin-top: 1rem; padding: 0.7rem 1rem; border-radius: 4px;
    background: rgba(184,74,74,0.1); color: var(--red);
    font-size: 0.82rem; display: none;
  }
  .login-error.show { display: block; }

  /* ── Dashboard layout ── */
  #dashboard { display: none; }
  #dashboard.active { display: block; }

  /* ── Top bar ── */
  .topbar {
    background: var(--pearl); border-bottom: 1px solid rgba(45,58,42,0.08);
    padding: 1rem 2rem; display: flex; justify-content: space-between;
    align-items: center; position: sticky; top: 0; z-index: 100;
  }
  .topbar-left { display: flex; align-items: center; gap: 1rem; }
  .topbar-left img { height: 42px; width: auto; object-fit: contain; }
  .topbar-left h2 {
    font-family: var(--display); font-weight: 300; font-size: 1.3rem;
    color: var(--forest);
  }
  .topbar-left h2 em { color: var(--terracotta); font-style: italic; }
  .topbar-right { display: flex; align-items: center; gap: 1rem; }
  .topbar-right .last-refresh { font-size: 0.72rem; color: var(--ink-soft); }
  .btn-sm {
    padding: 0.5rem 1.1rem; background: var(--forest); color: var(--cream);
    border: none; border-radius: 999px; font-family: var(--sans);
    font-size: 0.7rem; font-weight: 500; text-transform: uppercase;
    letter-spacing: 0.18em; cursor: pointer; transition: all 0.3s ease;
    text-decoration: none; display: inline-flex; align-items: center; gap: 0.4rem;
  }
  .btn-sm:hover { background: var(--terracotta); }
  .btn-sm-outline {
    background: transparent; color: var(--ink-soft);
    border: 1px solid rgba(45,58,42,0.2);
  }
  .btn-sm-outline:hover { background: var(--cream-deep); color: var(--forest); }
  .btn-sm-danger { background: var(--red); }
  .btn-sm-danger:hover { background: #d44a4a; }
  .btn-sm-success { background: var(--green); }
  .btn-sm-success:hover { background: #3d9a5e; }
  .btn-sm:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ── Stats ── */
  .stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 1rem; padding: 1.5rem 2rem 0; max-width: 1400px; margin: 0 auto;
  }
  .stat-card {
    background: var(--pearl); border: 1px solid rgba(45,58,42,0.08);
    border-radius: 8px; padding: 1.2rem 1.4rem;
  }
  .stat-card .num {
    font-family: var(--display); font-size: 2rem; color: var(--forest);
    line-height: 1; margin-bottom: 0.3rem;
  }
  .stat-card .num em { color: var(--terracotta); font-style: italic; }
  .stat-card .lbl {
    font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.18em;
    color: var(--ink-soft); font-weight: 500;
  }
  .stat-card.pending { border-left: 3px solid var(--amber); }
  .stat-card.confirmed { border-left: 3px solid var(--green); }
  .stat-card.cancelled { border-left: 3px solid var(--red); }

  /* ── Filters ── */
  .filters {
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 1rem;
    padding: 1.5rem 2rem 0; max-width: 1400px; margin: 0 auto;
  }
  .filter-tabs { display: flex; gap: 0.3rem; flex-wrap: wrap; }
  .filter-tab {
    padding: 0.5rem 1rem; border-radius: 999px; border: 1px solid rgba(45,58,42,0.12);
    background: transparent; font-family: var(--sans); font-size: 0.75rem;
    color: var(--ink-soft); cursor: pointer; transition: all 0.2s ease;
    font-weight: 500;
  }
  .filter-tab:hover { border-color: var(--sage); }
  .filter-tab.active { background: var(--forest); color: var(--cream); border-color: var(--forest); }
  .filter-search {
    display: flex; align-items: center; gap: 0.5rem;
  }
  .filter-search input {
    padding: 0.5rem 0.9rem; border: 1px solid rgba(45,58,42,0.15);
    border-radius: 999px; background: var(--pearl);
    font-family: var(--sans); font-size: 0.82rem; color: var(--ink);
    width: 200px; transition: border-color 0.3s ease;
  }
  .filter-search input:focus { outline: none; border-color: var(--forest); }

  /* ── Bookings list ── */
  .bookings-wrap {
    padding: 1.5rem 2rem 3rem; max-width: 1400px; margin: 0 auto;
  }
  .booking-table { width: 100%; border-collapse: collapse; }
  .booking-table thead th {
    text-align: left; font-size: 0.66rem; text-transform: uppercase;
    letter-spacing: 0.18em; color: var(--ink-soft); font-weight: 500;
    padding: 0.8rem 0.7rem; border-bottom: 1px solid rgba(45,58,42,0.1);
    white-space: nowrap;
  }
  .booking-table tbody tr {
    cursor: pointer; transition: background 0.15s ease;
  }
  .booking-table tbody tr:hover { background: rgba(45,58,42,0.04); }
  .booking-table tbody tr.active { background: rgba(45,58,42,0.06); }
  .booking-table tbody td {
    padding: 0.75rem 0.7rem; font-size: 0.88rem;
    border-bottom: 1px solid rgba(45,58,42,0.06);
    vertical-align: middle;
  }
  .booking-table tbody td:first-child { border-radius: 6px 0 0 6px; }
  .booking-table tbody td:last-child { border-radius: 0 6px 6px 0; }

  .badge {
    display: inline-flex; align-items: center; gap: 0.3rem;
    padding: 0.2rem 0.6rem; border-radius: 999px;
    font-size: 0.68rem; font-weight: 500; text-transform: uppercase;
    letter-spacing: 0.08em;
  }
  .badge-pending { background: rgba(196,126,58,0.12); color: var(--amber); }
  .badge-confirmed { background: rgba(74,124,92,0.12); color: var(--green); }
  .badge-cancelled { background: rgba(184,74,74,0.1); color: var(--red); }

  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; display: inline-block;
    margin-right: 0.4rem; vertical-align: middle;
  }
  .status-dot.pending { background: var(--amber); }
  .status-dot.confirmed { background: var(--green); }
  .status-dot.cancelled { background: var(--red); }

  .client-info .name { font-weight: 500; color: var(--forest); }
  .client-info .email { font-size: 0.78rem; color: var(--ink-soft); }

  /* ── Detail panel ── */
  .detail-overlay {
    position: fixed; inset: 0; z-index: 200;
    background: rgba(31,29,24,0.4); display: none;
    animation: fadeIn 0.2s ease;
  }
  .detail-overlay.open { display: block; }

  .detail-panel {
    position: fixed; top: 0; right: -480px; width: 480px; max-width: 100vw;
    height: 100vh; z-index: 201; background: var(--pearl);
    box-shadow: -10px 0 60px rgba(45,58,42,0.12);
    transition: right 0.35s cubic-bezier(0.4,0,0.2,1);
    display: flex; flex-direction: column; overflow: hidden;
  }
  .detail-panel.open { right: 0; }

  .detail-head {
    padding: 1.5rem 1.8rem; border-bottom: 1px solid rgba(45,58,42,0.08);
    display: flex; justify-content: space-between; align-items: flex-start;
  }
  .detail-head h2 {
    font-family: var(--display); font-weight: 300; font-size: 1.5rem;
    color: var(--forest); line-height: 1.2;
  }
  .detail-head h2 small {
    display: block; font-family: var(--sans); font-size: 0.7rem;
    color: var(--ink-soft); font-weight: 400;
    text-transform: uppercase; letter-spacing: 0.15em;
    margin-top: 0.2rem;
  }
  .detail-close {
    width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(45,58,42,0.15);
    background: var(--cream); cursor: pointer; font-size: 1.1rem;
    color: var(--ink-soft); display: flex; align-items: center; justify-content: center;
    transition: all 0.2s ease; flex-shrink: 0;
  }
  .detail-close:hover { background: var(--forest); color: var(--cream); border-color: var(--forest); }

  .detail-body {
    flex: 1; overflow-y: auto; padding: 1.5rem 1.8rem;
  }
  .detail-group { margin-bottom: 1.5rem; }
  .detail-group:last-child { margin-bottom: 0; }
  .detail-group h3 {
    font-size: 0.66rem; text-transform: uppercase; letter-spacing: 0.2em;
    color: var(--sage-deep); font-weight: 500; margin-bottom: 0.6rem;
    font-family: var(--sans);
  }
  .detail-row {
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 0.4rem 0; font-size: 0.88rem;
    border-bottom: 1px solid rgba(45,58,42,0.04);
  }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .lbl { color: var(--ink-soft); }
  .detail-row .val { color: var(--forest); font-weight: 400; text-align: right; max-width: 60%; }
  .detail-divider { height: 1px; background: rgba(45,58,42,0.08); margin: 1.2rem 0; }

  .detail-actions {
    padding: 1.3rem 1.8rem; border-top: 1px solid rgba(45,58,42,0.08);
    display: flex; gap: 0.7rem; flex-wrap: wrap;
  }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .empty-state {
    text-align: center; padding: 5rem 2rem; color: var(--ink-soft);
  }
  .empty-state .icon { font-size: 3rem; margin-bottom: 1rem; opacity: 0.4; }
  .empty-state h3 { font-family: var(--display); font-size: 1.3rem; color: var(--forest); font-weight: 300; margin-bottom: 0.5rem; }
  .empty-state p { font-size: 0.9rem; }

  .toast {
    position: fixed; bottom: 2rem; right: 2rem; z-index: 500;
    padding: 0.9rem 1.4rem; border-radius: 8px;
    background: var(--forest); color: var(--cream);
    font-size: 0.85rem; box-shadow: 0 10px 40px rgba(45,58,42,0.15);
    transform: translateY(120px); opacity: 0;
    transition: all 0.4s cubic-bezier(0.4,0,0.2,1);
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { background: var(--green); }
  .toast.error { background: var(--red); }

  /* ── Loading ── */
  .loading-spinner {
    display: inline-block; width: 1rem; height: 1rem;
    border: 2px solid rgba(45,58,42,0.15); border-top-color: var(--forest);
    border-radius: 50%; animation: spin 0.6s linear infinite;
    vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ── Responsive ── */
  @media (max-width: 1024px) {
    .stats { grid-template-columns: repeat(2, 1fr); }
    .filters { flex-direction: column; align-items: stretch; }
    .filter-search input { width: 100%; }
    .topbar { padding: 0.8rem 1rem; }
    .topbar-left img { height: 32px; }
    .topbar-left h2 { font-size: 1rem; }
    .stats { padding: 1rem 1rem 0; }
    .filters { padding: 1rem 1rem 0; }
    .bookings-wrap { padding: 1rem 1rem 2rem; }
    .booking-table thead th, .booking-table tbody td { padding: 0.6rem 0.4rem; font-size: 0.8rem; }
    .detail-panel { width: 100vw; right: -100vw; }
  }
  @media (max-width: 600px) {
    .stats { grid-template-columns: repeat(2, 1fr); gap: 0.6rem; }
    .stat-card { padding: 0.8rem 1rem; }
    .stat-card .num { font-size: 1.5rem; }
    .topbar-left h2 { display: none; }
    .booking-table { font-size: 0.78rem; }
    .booking-table tbody td { padding: 0.5rem 0.3rem; }
  }
</style>
</head>
<body>

<!-- ========== LOGIN SCREEN ========== -->
<div id="login-screen">
  <div class="login-card">
    <img src="logo.png" alt="Ruta Naturals" />
    <h1>Admin <em>panel</em></h1>
    <p>Enter your admin password to continue.</p>
    <label for="login-pw">Password</label>
    <input type="password" id="login-pw" placeholder="Admin password" autocomplete="current-password" />
    <button class="btn" id="login-btn">Sign In</button>
    <div class="login-error" id="login-error">Incorrect password. Try again.</div>
  </div>
</div>

<!-- ========== DASHBOARD ========== -->
<div id="dashboard">
  <!-- Top bar -->
  <div class="topbar">
    <div class="topbar-left">
      <img src="logo.png" alt="Ruta Naturals" />
      <h2>Admin <em>panel</em></h2>
    </div>
    <div class="topbar-right">
      <span class="last-refresh" id="refresh-label">—</span>
      <button class="btn-sm btn-sm-outline" id="refresh-btn" onclick="fetchBookings()">↻ Refresh</button>
      <a href="/" class="btn-sm btn-sm-outline" target="_blank">View Site</a>
      <button class="btn-sm" id="logout-btn">Logout</button>
    </div>
  </div>

  <!-- Stats -->
  <div class="stats" id="stats-row">
    <div class="stat-card">
      <div class="num" id="stat-total">—</div>
      <div class="lbl">Total Bookings</div>
    </div>
    <div class="stat-card pending">
      <div class="num" id="stat-pending"><em>—</em></div>
      <div class="lbl">Pending</div>
    </div>
    <div class="stat-card confirmed">
      <div class="num" id="stat-confirmed">—</div>
      <div class="lbl">Confirmed</div>
    </div>
    <div class="stat-card cancelled">
      <div class="num" id="stat-cancelled">—</div>
      <div class="lbl">Cancelled</div>
    </div>
  </div>

  <!-- Filters -->
  <div class="filters">
    <div class="filter-tabs" id="filter-tabs">
      <button class="filter-tab active" data-filter="all">All</button>
      <button class="filter-tab" data-filter="pending">Pending</button>
      <button class="filter-tab" data-filter="confirmed">Confirmed</button>
      <button class="filter-tab" data-filter="cancelled">Cancelled</button>
    </div>
    <div class="filter-search">
      <input type="text" id="search-input" placeholder="Search name, email, or ID…" />
    </div>
  </div>

  <!-- Bookings list -->
  <div class="bookings-wrap">
    <div id="bookings-list"></div>
    <div class="empty-state" id="empty-state" style="display:none;">
      <div class="icon">📋</div>
      <h3>No bookings yet</h3>
      <p>When clients book a session, their details will appear here.</p>
    </div>
  </div>
</div>

<!-- ========== DETAIL PANEL ========== -->
<div class="detail-overlay" id="detail-overlay"></div>
<div class="detail-panel" id="detail-panel">
  <div class="detail-head">
    <div>
      <h2 id="detail-title">Booking <em>RN-0001</em></h2>
      <small id="detail-subtitle">Komfort Flow Reset</small>
    </div>
    <button class="detail-close" id="detail-close">✕</button>
  </div>
  <div class="detail-body" id="detail-body">
    <!-- populated dynamically -->
  </div>
  <div class="detail-actions" id="detail-actions">
    <!-- populated dynamically -->
  </div>
</div>

<!-- ========== TOAST ========== -->
<div class="toast" id="toast"></div>

<script>
  // ── State ──
  const API = '';
  let token = sessionStorage.getItem('admin_token') || '';
  let bookings = [];
  let currentFilter = 'all';
  let currentBookingId = null;
  let refreshInterval = null;

  // ── Auth ──
  function isLoggedIn() { return !!token; }

  async function login(password) {
    // We store the password as the token and use Bearer auth
    token = password;
    try {
      const res = await fetch(API + '/api/admin/bookings', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (res.ok) {
        sessionStorage.setItem('admin_token', token);
        showDashboard();
        fetchBookings();
        startAutoRefresh();
      } else {
        token = '';
        sessionStorage.removeItem('admin_token');
        document.getElementById('login-error').classList.add('show');
      }
    } catch (e) {
      token = '';
      document.getElementById('login-error').textContent = 'Network error — is the server running?';
      document.getElementById('login-error').classList.add('show');
    }
  }

  function logout() {
    token = '';
    sessionStorage.removeItem('admin_token');
    stopAutoRefresh();
    document.getElementById('dashboard').classList.remove('active');
    document.getElementById('login-screen').classList.remove('hidden');
    document.getElementById('login-pw').value = '';
    document.getElementById('login-error').classList.remove('show');
    closeDetail();
  }

  // ── Auto-refresh ──
  function startAutoRefresh() {
    stopAutoRefresh();
    refreshInterval = setInterval(fetchBookings, 30000);
  }
  function stopAutoRefresh() {
    if (refreshInterval) { clearInterval(refreshInterval); refreshInterval = null; }
  }

  // ── UI: Login / Dashboard ──
  function showDashboard() {
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('dashboard').classList.add('active');
  }

  // ── Fetch bookings ──
  async function fetchBookings() {
    try {
      const params = new URLSearchParams();
      if (currentFilter !== 'all') params.set('status', currentFilter);
      const searchVal = document.getElementById('search-input').value.trim();
      if (searchVal) params.set('search', searchVal);

      const res = await fetch(API + '/api/admin/bookings?' + params.toString(), {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      if (res.status === 401) { logout(); return; }
      if (!res.ok) throw new Error('Fetch failed');
      const data = await res.json();

      // Also fetch unfiltered total for stats
      const totalRes = await fetch(API + '/api/admin/bookings', {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const totalData = totalRes.ok ? await totalRes.json() : null;

      bookings = data.bookings || [];

      document.getElementById('refresh-label').textContent =
        'Updated ' + new Date().toLocaleTimeString();

      if (totalData) {
        const all = totalData.bookings || [];
        document.getElementById('stat-total').textContent = all.length;
        document.getElementById('stat-pending').innerHTML =
          '<em>' + all.filter(b => b.status === 'pending').length + '</em>';
        document.getElementById('stat-confirmed').textContent =
          all.filter(b => b.status === 'confirmed').length;
        document.getElementById('stat-cancelled').textContent =
          all.filter(b => b.status === 'cancelled').length;
      }

      renderBookings();

    } catch (e) {
      console.error('Fetch error:', e);
    }
  }

  // ── Render bookings table ──
  function renderBookings() {
    const container = document.getElementById('bookings-list');
    const empty = document.getElementById('empty-state');

    if (bookings.length === 0) {
      container.innerHTML = '';
      empty.style.display = 'block';
      // Update message if filtering
      if (currentFilter !== 'all') {
        empty.querySelector('h3').textContent = 'No ' + currentFilter + ' bookings';
        empty.querySelector('p').textContent = 'There are no bookings with "' + currentFilter + '" status.';
      } else {
        empty.querySelector('h3').textContent = 'No bookings yet';
        empty.querySelector('p').textContent = 'When clients book a session, their details will appear here.';
      }
      return;
    }
    empty.style.display = 'none';

    const isMobile = window.innerWidth < 768;
    if (isMobile) {
      container.innerHTML = bookings.map(b => renderMobileCard(b)).join('');
    } else {
      container.innerHTML = `
        <table class="booking-table">
          <thead>
            <tr>
              <th>Status</th>
              <th>Booking</th>
              <th>Date</th>
              <th>Client</th>
              <th>Treatment</th>
              <th>Amount</th>
            </tr>
          </thead>
          <tbody>
            ${bookings.map(b => renderRow(b)).join('')}
          </tbody>
        </table>`;
    }
  }

  function renderRow(b) {
    const badgeClass = 'badge-' + b.status;
    const dateStr = formatDate(b.date);
    const treatmentName = b.treatment === 'video-consultation' ? 'Video Call' : 'Komfort Flow';
    return `
      <tr onclick="openDetail('${b.id}')">
        <td><span class="status-dot ${b.status}"></span><span class="badge ${badgeClass}">${b.status}</span></td>
        <td style="font-family:var(--display);font-weight:400;">${b.bookingId}</td>
        <td>${dateStr}</td>
        <td><div class="client-info"><div class="name">${esc(b.firstName)} ${esc(b.lastName)}</div><div class="email">${esc(b.email)}</div></div></td>
        <td>${treatmentName}</td>
        <td>$${(b.amount / 100).toFixed(2)}</td>
      </tr>`;
  }

  function renderMobileCard(b) {
    const badgeClass = 'badge-' + b.status;
    const dateStr = formatDate(b.date);
    const treatmentName = b.treatment === 'video-consultation' ? 'Video Consultation' : 'Komfort Flow Reset';
    return `
      <div onclick="openDetail('${b.id}')" style="background:var(--pearl);border:1px solid rgba(45,58,42,0.08);border-radius:8px;padding:1rem;margin-bottom:0.7rem;cursor:pointer;transition:background 0.15s;">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:0.5rem;">
          <span class="badge ${badgeClass}">${b.status}</span>
          <span style="font-family:var(--display);font-weight:400;font-size:0.9rem;">${b.bookingId}</span>
        </div>
        <div style="font-weight:500;color:var(--forest);font-size:0.9rem;">${esc(b.firstName)} ${esc(b.lastName)}</div>
        <div style="font-size:0.78rem;color:var(--ink-soft);margin-top:0.2rem;">${dateStr} · ${treatmentName} · $${(b.amount / 100).toFixed(2)}</div>
      </div>`;
  }

  // ── Detail panel ──
  function openDetail(id) {
    currentBookingId = id;
    const b = bookings.find(x => x.id === id);
    if (!b) return;

    document.getElementById('detail-title').innerHTML = `Booking <em>${b.bookingId}</em>`;
    document.getElementById('detail-subtitle').textContent =
      b.treatment === 'video-consultation' ? 'Video Consultation' : 'Komfort Flow Reset';

    const badgeClass = 'badge-' + b.status;
    const dateStr = formatDate(b.date);
    const createdDate = new Date(b.createdAt).toLocaleString();
    const isVideo = b.treatment === 'video-consultation';
    const perPersonPrice = (b.guests >= 2 && !isVideo) ? 160 : (b.amount / 100);
    const treatmentTotal = perPersonPrice * (isVideo ? 1 : b.guests) + b.travelFee;

    document.getElementById('detail-body').innerHTML = `
      <div class="detail-group">
        <h3>Status</h3>
        <div><span class="badge ${badgeClass}" style="font-size:0.8rem;padding:0.3rem 0.8rem;">${b.status}</span></div>
      </div>
      <div class="detail-divider"></div>
      <div class="detail-group">
        <h3>Booking Info</h3>
        <div class="detail-row"><span class="lbl">Booking ID</span><span class="val">${b.bookingId}</span></div>
        <div class="detail-row"><span class="lbl">Treatment</span><span class="val">${isVideo ? 'Video Consultation' : 'Komfort Flow Reset'}</span></div>
        <div class="detail-row"><span class="lbl">Date / Time</span><span class="val">${dateStr}</span></div>
        <div class="detail-row"><span class="lbl">Guests</span><span class="val">${b.guests} ${b.guests >= 2 ? '(20% off applied)' : ''}</span></div>
        ${b.travelFee > 0 ? `<div class="detail-row"><span class="lbl">Travel Fee</span><span class="val" style="color:var(--amber);">+$${b.travelFee.toFixed(2)}</span></div>` : ''}
        <div class="detail-row"><span class="lbl">Created</span><span class="val">${createdDate}</span></div>
        ${b.confirmedAt ? `<div class="detail-row"><span class="lbl">Confirmed</span><span class="val">${new Date(b.confirmedAt).toLocaleString()}</span></div>` : ''}
        ${b.cancelledAt ? `<div class="detail-row"><span class="lbl">Cancelled</span><span class="val">${new Date(b.cancelledAt).toLocaleString()}</span></div>` : ''}
      </div>
      <div class="detail-divider"></div>
      <div class="detail-group">
        <h3>Client</h3>
        <div class="detail-row"><span class="lbl">Name</span><span class="val">${esc(b.firstName)} ${esc(b.lastName)}</span></div>
        <div class="detail-row"><span class="lbl">Email</span><span class="val">${esc(b.email)}</span></div>
        <div class="detail-row"><span class="lbl">Phone</span><span class="val">${esc(b.phone)}</span></div>
        ${!isVideo && b.address && b.address !== 'N/A' ? `<div class="detail-row"><span class="lbl">Address</span><span class="val">${esc(b.address)}</span></div>` : ''}
        ${b.notes ? `<div class="detail-row"><span class="lbl">Notes</span><span class="val" style="font-style:italic;">${esc(b.notes)}</span></div>` : ''}
      </div>
      <div class="detail-divider"></div>
      <div class="detail-group">
        <h3>Payment</h3>
        <div class="detail-row"><span class="lbl">Status</span><span class="val" style="color:var(--green);">${b.paymentStatus}</span></div>
        <div class="detail-row"><span class="lbl">Deposit Paid</span><span class="val">$${(b.amount / 100).toFixed(2)}</span></div>
        ${!isVideo ? `<div class="detail-row"><span class="lbl">Balance at Visit</span><span class="val">$${(treatmentTotal - b.amount / 100).toFixed(2)}</span></div>` : ''}
      </div>
    `;

    // Action buttons
    const actions = document.getElementById('detail-actions');
    if (b.status === 'pending') {
      actions.innerHTML = `
        <button class="btn-sm btn-sm-success" onclick="updateStatus('${b.id}','confirmed')">✓ Confirm Booking</button>
        <button class="btn-sm btn-sm-danger" onclick="updateStatus('${b.id}','cancelled')">✕ Cancel Booking</button>
        <button class="btn-sm btn-sm-outline" onclick="closeDetail()" style="margin-left:auto;">Close</button>
      `;
    } else if (b.status === 'confirmed') {
      actions.innerHTML = `
        <button class="btn-sm btn-sm-danger" onclick="updateStatus('${b.id}','cancelled')">✕ Mark Cancelled</button>
        <button class="btn-sm btn-sm-outline" onclick="updateStatus('${b.id}','pending')">↻ Reset to Pending</button>
        <button class="btn-sm btn-sm-outline" onclick="closeDetail()" style="margin-left:auto;">Close</button>
      `;
    } else if (b.status === 'cancelled') {
      actions.innerHTML = `
        <button class="btn-sm btn-sm-success" onclick="updateStatus('${b.id}','confirmed')">✓ Rebook</button>
        <button class="btn-sm btn-sm-outline" onclick="updateStatus('${b.id}','pending')">↻ Reset to Pending</button>
        <button class="btn-sm btn-sm-outline" onclick="closeDetail()" style="margin-left:auto;">Close</button>
      `;
    }

    document.getElementById('detail-overlay').classList.add('open');
    document.getElementById('detail-panel').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeDetail() {
    document.getElementById('detail-overlay').classList.remove('open');
    document.getElementById('detail-panel').classList.remove('open');
    document.body.style.overflow = '';
    currentBookingId = null;
  }

  // ── Update booking status ──
  async function updateStatus(id, status) {
    try {
      const res = await fetch(API + '/api/admin/bookings/' + id, {
        method: 'PATCH',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + token
        },
        body: JSON.stringify({ status })
      });
      if (!res.ok) throw new Error('Update failed');
      const data = await res.json();
      showToast('Booking ' + data.booking.bookingId + ' marked as ' + status, 'success');
      closeDetail();
      fetchBookings();
    } catch (e) {
      showToast('Failed to update: ' + e.message, 'error');
    }
  }

  // ── Toast ──
  function showToast(msg, type) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.className = 'toast ' + (type || '');
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3500);
  }

  // ── Helpers ──
  function esc(s) {
    if (!s) return '';
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function formatDate(dateStr) {
    if (!dateStr) return '—';
    // dateStr can be "Mon May 11 2026 at 10:00 AM" or similar
    try {
      // Try to extract meaningful date
      if (dateStr.includes('Preferred Call Time')) {
        return dateStr.replace('Preferred Call Time: ', '');
      }
      const d = new Date(dateStr);
      if (!isNaN(d.getTime())) {
        return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
      }
      return dateStr;
    } catch (e) { return dateStr; }
  }

  // ── Event listeners ──
  document.getElementById('login-btn').addEventListener('click', () => {
    const pw = document.getElementById('login-pw').value;
    if (pw) login(pw);
  });
  document.getElementById('login-pw').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('login-btn').click();
  });
  document.getElementById('logout-btn').addEventListener('click', logout);

  document.getElementById('detail-close').addEventListener('click', closeDetail);
  document.getElementById('detail-overlay').addEventListener('click', closeDetail);

  // Filter tabs
  document.querySelectorAll('.filter-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.filter-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      currentFilter = tab.dataset.filter;
      fetchBookings();
    });
  });

  // Search with debounce
  let searchTimer;
  document.getElementById('search-input').addEventListener('input', () => {
    clearTimeout(searchTimer);
    searchTimer = setTimeout(fetchBookings, 300);
  });

  // Keyboard: Escape closes detail
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') closeDetail();
  });

  // ── Init ──
  if (isLoggedIn()) {
    showDashboard();
    fetchBookings();
    startAutoRefresh();
  }

  // Responsive: re-render on resize
  let resizeTimer;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(renderBookings, 200);
  });
</script>

</body>
</html>
