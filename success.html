<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Booking Confirmed — Ruta Naturals</title>
  <meta name="description" content="Your booking with Ruta Naturals is confirmed. Check your email for details." />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://rutanaturals.com/success.html" />
  <meta property="og:title" content="Booking Confirmed — Ruta Naturals" />
  <meta property="og:description" content="Your booking with Ruta Naturals is confirmed. Check your email for details." />
  <meta property="og:image" content="/hero.jpg" />
  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Booking Confirmed — Ruta Naturals" />
  <meta name="twitter:description" content="Your booking with Ruta Naturals is confirmed. Check your email for details." />
  <meta name="twitter:image" content="/hero.jpg" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/logo.png" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300;1,400&family=Fraunces:ital,opsz,wght@0,9..144,300;1,9..144,300&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream: #f4ede1; --cream-deep: #ebe1cf; --forest: #2d3a2a;
      --terracotta: #b8674a; --terracotta-soft: #d49278;
      --sage: #8a9a7b; --sage-deep: #5b6e52;
      --ink: #1f1d18; --ink-soft: #4a463d; --pearl: #fbf7ee;
      --warning: #c47e3a;
      --display: 'Fraunces', Georgia, serif;
      --sans: 'Inter', -apple-system, sans-serif;
      --serif: 'Cormorant Garamond', serif;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--sans); background: var(--cream);
      color: var(--ink); min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 2rem 1.5rem; font-weight: 300;
    }
    body::before {
      content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 999;
      opacity: 0.05;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }

    .card {
      max-width: 580px; width: 100%;
      background: var(--pearl); border-radius: 12px;
      padding: 3.5rem 3rem; text-align: center;
      box-shadow: 0 40px 100px rgba(45,58,42,0.1);
      border: 1px solid rgba(45,58,42,0.06);
      animation: rise 0.9s cubic-bezier(0.4,0,0.2,1) both;
    }
    @keyframes rise {
      from { opacity:0; transform:translateY(40px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .check-circle {
      width: 72px; height: 72px; border-radius: 50%;
      background: var(--sage); margin: 0 auto 2rem;
      display: flex; align-items: center; justify-content: center;
      animation: pop 0.6s cubic-bezier(0.34,1.56,0.64,1) 0.4s both;
    }
    @keyframes pop {
      from { transform: scale(0); opacity: 0; }
      to   { transform: scale(1); opacity: 1; }
    }
    .check-circle svg {
      width: 36px; height: 36px; stroke: var(--cream);
      fill: none; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
    }

    .eyebrow {
      font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.3em;
      color: var(--terracotta); font-weight: 500; margin-bottom: 1rem;
    }
    h1 {
      font-family: var(--display); font-weight: 300; font-size: 2.6rem;
      line-height: 1.05; margin-bottom: 0.8rem;
    }
    h1 em { font-style: italic; color: var(--terracotta); }

    .lede {
      color: var(--ink-soft); font-size: 1rem; line-height: 1.7; margin-bottom: 0;
    }

    .divider {
      margin: 1.8rem auto; width: 40px; height: 1px; background: rgba(45,58,42,0.2);
    }

    /* ── summary table ── */
    .summary {
      background: var(--cream); border-radius: 8px;
      border: 1px solid rgba(45,58,42,0.1);
      text-align: left; overflow: hidden;
    }
    .summary-head {
      padding: 1rem 1.5rem;
      background: var(--forest); color: var(--cream);
      font-family: var(--display); font-size: 1rem; font-weight: 300;
    }
    .summary-head em { color: var(--terracotta-soft); font-style: italic; }
    .summary-row {
      display: flex; justify-content: space-between; align-items: flex-start;
      padding: 0.75rem 1.5rem;
      border-bottom: 1px solid rgba(45,58,42,0.07);
      font-size: 0.88rem;
    }
    .summary-row:last-child { border-bottom: none; }
    .summary-row .lbl {
      font-size: 0.66rem; text-transform: uppercase;
      letter-spacing: 0.2em; color: var(--ink-soft); font-weight: 500;
      padding-top: 0.1rem;
    }
    .summary-row .val {
      font-family: var(--display); color: var(--forest);
      text-align: right; max-width: 62%; line-height: 1.3;
    }
    .summary-row .val em { color: var(--terracotta); font-style: italic; }

    /* payment row */
    .pay-row {
      margin-top: 1rem;
      padding: 1rem 1.5rem;
      background: var(--forest); border-radius: 8px;
      border-left: 4px solid var(--terracotta);
      display: flex; justify-content: space-between; align-items: center;
    }
    .pay-row .pay-lbl {
      font-size: 0.68rem; text-transform: uppercase;
      letter-spacing: 0.2em; color: rgba(244,237,225,0.7);
    }
    .pay-row .pay-lbl span {
      display: block; font-family: var(--display);
      font-size: 1.6rem; color: var(--terracotta-soft);
      line-height: 1; margin-top: 0.2rem;
    }
    .pay-row .pay-note {
      font-size: 0.78rem; color: rgba(244,237,225,0.65);
      text-align: right; max-width: 55%; line-height: 1.4;
    }

    /* balance at visit */
    .balance-row {
      margin-top: 0.6rem;
      padding: 0.85rem 1.5rem;
      background: rgba(196,126,58,0.1);
      border-left: 3px solid var(--warning); border-radius: 6px;
      display: flex; justify-content: space-between; align-items: center;
      font-size: 0.84rem;
    }
    .balance-row .b-lbl { color: var(--ink-soft); }
    .balance-row .b-val { font-family: var(--display); color: var(--warning); font-size: 1.05rem; }

    /* next steps */
    .next-steps {
      margin-top: 1rem;
      padding: 1.1rem 1.4rem;
      background: rgba(138,154,123,0.12);
      border-left: 3px solid var(--sage); border-radius: 6px;
      text-align: left; font-size: 0.88rem; color: var(--ink-soft); line-height: 1.6;
    }
    .next-steps strong { color: var(--forest); }

    /* email note */
    .email-note {
      margin-top: 1rem;
      font-size: 0.83rem; color: var(--ink-soft); line-height: 1.5;
    }
    .email-note strong { color: var(--forest); }

    .btn {
      display: inline-flex; align-items: center; gap: 0.6rem;
      padding: 0.95rem 2rem; background: var(--forest); color: var(--cream);
      text-decoration: none; font-family: var(--sans); font-size: 0.8rem;
      font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase;
      border-radius: 999px; transition: all 0.3s ease; border: none; cursor: pointer;
    }
    .btn:hover { background: var(--terracotta); transform: translateY(-2px); }

    .contact {
      margin-top: 1.5rem; font-size: 0.83rem; color: var(--ink-soft);
    }
    .contact a { color: var(--terracotta); text-decoration: none; }

    /* skeleton loader */
    .skeleton {
      background: linear-gradient(90deg, var(--cream-deep) 25%, var(--sand) 50%, var(--cream-deep) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 4px; height: 1em;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    @media (max-width: 480px) {
      .card { padding: 2.5rem 1.5rem; }
      h1 { font-size: 2rem; }
      .pay-row { flex-direction: column; gap: 0.8rem; text-align: left; }
      .pay-row .pay-note { text-align: left; max-width: 100%; }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check-circle">
      <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
    </div>

    <div class="eyebrow" id="eyebrow">Payment Received</div>
    <h1 id="headline">You're all <em>set.</em></h1>
    <p class="lede" id="lede">Your booking is confirmed — Ruta will be in touch shortly.</p>

    <div class="divider"></div>

    <!-- Booking summary — populated by JS -->
    <div id="summary-wrap">
      <!-- skeleton while loading -->
      <div class="summary" id="skeleton-summary">
        <div class="summary-head">Booking <em>summary</em></div>
        <div class="summary-row" style="gap:1rem;">
          <div class="lbl" style="width:35%;">Loading</div>
          <div class="val" style="width:55%;"><div class="skeleton">&nbsp;</div></div>
        </div>
        <div class="summary-row" style="gap:1rem;">
          <div class="lbl" style="width:35%;">&nbsp;</div>
          <div class="val" style="width:55%;"><div class="skeleton">&nbsp;</div></div>
        </div>
        <div class="summary-row" style="gap:1rem;">
          <div class="lbl" style="width:35%;">&nbsp;</div>
          <div class="val" style="width:55%;"><div class="skeleton">&nbsp;</div></div>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <a href="/" class="btn">Back to Ruta Naturals →</a>

    <div class="contact">
      Questions? Call or text <a href="tel:8885525752">(888) 552-5752</a><br/>
      or email <a href="mailto:rutanaturalle@gmail.com">rutanaturalle@gmail.com</a>
    </div>
  </div>

  <script>
    const monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];

    function row(label, value) {
      return `<div class="summary-row">
        <div class="lbl">${label}</div>
        <div class="val">${value}</div>
      </div>`;
    }

    function renderSummary(data) {
      const m = data.meta;
      const isVideo = m.treatment === 'video-consultation';
      const guests = parseInt(m.guests, 10) || 1;
      const travelFee = parseFloat(m.travelFee) || 0;
      const hasGroup = !isVideo && guests >= 2;
      const perPerson = hasGroup ? 160 : 200;
      const treatmentTotal = isVideo ? 25 : perPerson * guests;
      const grandTotal = treatmentTotal + travelFee;
      const balanceAtVisit = grandTotal - 25;

      // Update header copy
      document.getElementById('eyebrow').textContent = isVideo ? 'Payment Received' : 'Deposit Received';
      document.getElementById('headline').innerHTML = `You're all <em>set,</em> ${m.firstName}.`;
      document.getElementById('lede').textContent = isVideo
        ? 'Your $25 payment went through. Ruta will send your video link to the email below.'
        : 'Your $25 deposit went through. Ruta will confirm your appointment personally within a few hours.';

      let rows = '';
      rows += row('Service', isVideo ? 'Video Consultation <em>(10 min)</em>' : 'Komfort Flow Reset <em>(~60 min)</em>');

      if (isVideo) {
        rows += row('Call time', m.date.replace('Preferred Call Time: ', ''));
      } else {
        // m.date = "Thu May 08 2025 at 11:00 AM"
        rows += row('Date &amp; time', m.date.replace(' at ', '<br><em>') + '</em>');
        rows += row('Address', m.address.replace(', FL ', '<br>') .replace(', ', '<br>'));
      }

      rows += row('Name', `${m.firstName} ${m.lastName}`);
      rows += row('Email', data.email);
      rows += row('Phone', m.phone);

      if (hasGroup) {
        rows += row('Guests', `${guests} people <em>— 20% group discount</em>`);
      }

      // Payment block
      const payNote = isVideo
        ? 'Full payment — no balance due.'
        : `Balance of <strong style="color:rgba(244,237,225,0.9);">$${balanceAtVisit.toFixed(2)}</strong> is paid in person at your visit${travelFee > 0 ? `, plus $${travelFee.toFixed(2)} travel fee` : ''}.`;

      const nextStepMsg = isVideo
        ? '<strong>What\'s next:</strong> Ruta will email your Zoom or Google Meet link within a few hours. Check your inbox (and spam, just in case).'
        : '<strong>What\'s next:</strong> Ruta will confirm your time by text or email within a few hours. She\'ll arrive with all equipment — just be home.';

      document.getElementById('summary-wrap').innerHTML = `
        <div class="summary">
          <div class="summary-head">Booking <em>summary</em></div>
          ${rows}
        </div>
        <div class="pay-row">
          <div class="pay-lbl">Paid now<span>$25.00</span></div>
          <div class="pay-note">${payNote}</div>
        </div>
        ${!isVideo && balanceAtVisit > 0 ? `
        <div class="balance-row">
          <div class="b-lbl">Balance due at visit</div>
          <div class="b-val">$${balanceAtVisit.toFixed(2)}</div>
        </div>` : ''}
        <div class="next-steps">${nextStepMsg}</div>
        <div class="email-note">A receipt has been sent to <strong>${data.email}</strong> by Stripe.</div>
      `;
    }

    function renderFallback() {
      document.getElementById('summary-wrap').innerHTML = `
        <div class="next-steps">
          <strong>What's next:</strong> Ruta will confirm your appointment personally by text or email within a few hours. A receipt has been sent to your email by Stripe.
        </div>
      `;
    }

    async function init() {
      const params = new URLSearchParams(location.search);
      const sessionId = params.get('session_id');
      if (!sessionId) { renderFallback(); return; }

      try {
        const res = await fetch(`/session-details?id=${encodeURIComponent(sessionId)}`);
        if (!res.ok) throw new Error('not found');
        const data = await res.json();
        renderSummary(data);
      } catch {
        renderFallback();
      }
    }

    init();
  </script>
</body>
</html>
